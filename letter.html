
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2d7df;
      font-family: Georgia, serif;
    }

    .scene {
      position: relative;
      width: 320px;
      height: 220px;
    }

    /* Envelope */
    .envelope {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 180px;
      background: #c2185b;
      border-radius: 0 0 12px 12px;
      z-index: 2;
      overflow: hidden;
    }

    /* Envelope flap */
    .flap {
      position: absolute;
      top: -90px;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-bottom: 90px solid #ad1457;
      transform-origin: bottom;
      animation: flapOpen 1.5s ease forwards;
    }

    /* Letter */
    .letter {
      position: absolute;
      bottom: 20px;
      left: 10px;
      width: 300px;
      height: 180px;
      background: #fffdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      padding: 20px;
      box-sizing: border-box;
      transform: translateY(120px);
      animation: letterOut 2s ease forwards;
      animation-delay: 1s;
      z-index: 1;
    }

    .letter::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: #e0cfc2;
      border-radius: 2px;
    }

    /* Animations */
    @keyframes flapOpen {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(180deg); }
    }

    @keyframes letterOut {
      0% { transform: translateY(120px); }
      100% { transform: translateY(-80px); }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="flap"></div>

    <div class="letter">
      Fola i really don't have much all i can say is i love you so much Folawe 🥹 
    </div>

    <div class="envelope"></div>
  </div>

</body>
</html>
